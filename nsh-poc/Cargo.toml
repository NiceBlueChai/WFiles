[package]
name = "nsh-app-wfiles-poc"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[features]
# SFTP 是**单独一个开关**（透传 core 的 `sftp` feature）。默认开：0.5.0 之后
# `pkcs1` 死锁已经在 core 那一侧解决（`russh` 不启用 rsa feature），不用再靠
# 「关掉整个远程」来躲。真要出一份不带远程的构建用 `--no-default-features`；
# 那时 core 的 `remote::open()` 会明确报"这个构建没有包含 SFTP 支持"，
# 界面不会留一个按了没反应的选项。
default = ["sftp"]
sftp = ["wfiles-core/sftp"]

[dependencies]
# 0.5.0 起 `nsh-tui-host` / `nsh-platform-tui` 已发布到 crates.io，`--target tui`
# 也在发布版 CLI 里，所以不再需要 0.4.0 时代的 path 依赖源码 checkout。
# CLI 就是官方发行版 `~/.nsh/bin/nsh`（0.5.0）。
nsh-core = "0.5.0"
nsh-base = "0.5.0"
# PoC 侧自写的薄实现要用的两个库，主仓库已有，编译缓存可复用。
serde_json = "1"
dirs = "6"
# 从 core 的内核事件流里取状态消息（core 自己也是用它做广播的）。
async-channel = "2"

# 主仓库的核心：目录模型、排序过滤、搬运、撤销、续传、特殊文件对象全在这儿。
# 与 GUI 版共用同一份代码——这一层不再自己写 fs::read_dir。
#
# `default-features = false` 是为了让 feature 只由上面的 `[features]` 说了算：
# 除了判据要用的 `test-support`，只有显式开的 `sftp` 会进依赖图。
#
# `test-support` 只在**这个 PoC 的 headless 判据**里用：`Wfiles.setTestVolumes()`
# 要借 core 的 `volumes::set_override` 钉住"本机挂着哪几块盘"，否则判据只能
# 拿跑测试那台机器的真实挂载点说事（空列表就什么都不验了）。
# NSH 的 `check` / `test` 编的是同一个 dylib，没有 dev 构建之分，所以只能把
# feature 开在依赖上；夹具默认是 `None`，正式路径一次都不经过它。
wfiles-core = { path = "../crates/wfiles-core", default-features = false, features = ["test-support"] }
