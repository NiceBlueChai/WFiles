[package]
name = "wfiles"
version = "0.1.0"
edition = "2024"
description = "A fast, cross-platform file manager built with GPUI Kit"
publish = false

[dependencies]
gpui-kit = "0.7.1"
dirs = "6"
open = "5"
notify = "8.2.0"
trash = "5.2.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.dev]
codegen-units = 16
debug = "limited"
split-debuginfo = "unpacked"

[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
gpui-pre-sum-tree = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }
resvg = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }

[dev-dependencies]
tempfile = "3.27.0"
