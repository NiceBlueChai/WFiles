[package]
name = "wfiles"
version = "0.1.0"
edition = "2024"
description = "A fast, cross-platform file manager built with GPUI Kit"
publish = false

[dependencies]
gpui-kit = "0.7.1"
async-channel = "2.5.0"
dirs = "6"
# 缩略图解码。GPUI 自己就带着 image，这里声明不会多编译一份。
image = "0.25"
open = "5"
notify = "8.2.0"
trash = "5.2.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
zip = { version = "9.0.2", default-features = false, features = ["deflate"] }
portable-pty = "0.9.0"
vt100 = "0.16.2"
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode-perl"] }
md5 = "0.8"
sha1 = "0.10"
sha2 = "0.10"
# 上面三个哈希库共用的 trait；直接声明是为了 `Digest` 的方法能用在它们三家身上。
digest = "0.10"
# S3 的签名是 HMAC 链（SigV4）：拿现成的 `hmac` 而不是自己写，
# 自己写 HMAC 最容易错在 padding 上，而错了只能拿到一堆 403。
hmac = "0.12"
# ---- 远程（P4）----
# ureq 用 2.x 而不是 3.x：3 会把方法名卡在 HTTP/1.1 的名单里，
# PROPFIND / MKCOL 这两个 WebDAV 必需的动作直接被拒。
ureq = { version = "2", default-features = false, features = ["tls"] }
quick-xml = { version = "0.38", default-features = false }

# 密码存系统钥匙串。**按平台分开声明，不是图省事写一份**：
# `keyring` 的 Linux 后端（secret-service）会拖进 zbus / dbus 一整条依赖链，
# 全平台写在 `[dependencies]` 里就等于让 macOS 和 Windows 的二进制也背上它们。
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "linux-native", "crypto-rust"] }

[profile.dev]
codegen-units = 16
debug = "limited"
split-debuginfo = "unpacked"

[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
gpui-pre-sum-tree = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }
resvg = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }

[dev-dependencies]
# test-support 打开 GPUI 的无头窗口与事件派发，
# 只在 cargo test 时生效，不影响正式构建。
gpui-kit = { version = "0.7.1", features = ["test-support"] }
tempfile = "3.27.0"
