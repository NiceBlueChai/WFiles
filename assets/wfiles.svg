<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    WFiles 的应用图标（唯一的设计来源）。渲染与打包走 scripts/make-icon.sh。

    网格（macOS 图标那条线，别随意动）：
    画布 1024，圆角方块 824 居中、四周留 100，圆角半径 185。

    图形：
    文件夹 560 宽 450 高，两层——后片（左上带标签页）偏冷，前袋纯白；
    前袋上沿一道中间亮、两头淡的冷光带，光顺着袋口往下洒一层；
    袋子正中一枚 W 徽记：先铺一层青色柔光，再压上蓝色渐变的笔画本体。

    改之前三件事：
    1. 这是唯一的设计来源，形状与色值只改这里，改完跑一次 make-icon.sh；
    2. XML 注释里不能出现两个连续的连字符，写参数时躲开；
    3. 全是矢量、没有位图，每个尺寸都从这份源稿重新光栅化。
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7C9DFF"/>
      <stop offset="0.48" stop-color="#4B6FF7"/>
      <stop offset="1" stop-color="#2A46DC"/>
    </linearGradient>
    <radialGradient id="bloom" cx="0.5" cy="0.4" r="0.66">
      <stop offset="0" stop-color="#9FEBFF" stop-opacity="0.42"/>
      <stop offset="0.5" stop-color="#5C86FF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#0B1E66" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.60"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F8FF"/>
      <stop offset="1" stop-color="#CBDCFA"/>
    </linearGradient>
    <linearGradient id="flap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E8F2FF"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D8F6FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#EAFBFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#D8F6FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="spill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B9E9FF" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#B9E9FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6FA8FF"/>
      <stop offset="1" stop-color="#1B3BD6"/>
    </linearGradient>
    <clipPath id="flapClip">
      <rect x="232" y="466" width="560" height="240" rx="42"/>
    </clipPath>
    <filter id="drop" x="-35%" y="-35%" width="170%" height="190%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#06125C" flood-opacity="0.34"/>
    </filter>
    <filter id="seam" x="-35%" y="-35%" width="170%" height="190%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0A1E7A" flood-opacity="0.26"/>
    </filter>
    <filter id="soft" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bloom)"/>
  <rect x="103" y="103" width="818" height="818" rx="182" fill="none" stroke="url(#rim)" stroke-width="4"/>

  <g transform="translate(0 20)">
    <g filter="url(#drop)">
      <path d="M 252 286 a 30 30 0 0 1 30 -30 h 140 a 30 30 0 0 1 30 30 v 58 h 292 a 28 28 0 0 1 28 28 v 302 a 32 32 0 0 1 -32 32 h -456 a 32 32 0 0 1 -32 -32 z"
            fill="url(#back)"/>
    </g>
    <g filter="url(#seam)">
      <rect x="232" y="466" width="560" height="240" rx="42" fill="url(#flap)"/>
    </g>
    <g clip-path="url(#flapClip)">
      <rect x="232" y="466" width="560" height="130" fill="url(#spill)"/>
    </g>
    <path d="M 262 466 H 762" stroke="url(#bar)" stroke-width="7" stroke-linecap="round"/>
    <path d="M 362 533 L 434 637 L 512 533 L 590 637 L 662 533" fill="none" stroke="#6FE0FF"
          stroke-width="70" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)" opacity="0.50"/>
    <path d="M 362 533 L 434 637 L 512 533 L 590 637 L 662 533" fill="none" stroke="url(#mark)"
          stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
